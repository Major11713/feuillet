<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Feuillet">
<meta name="theme-color" content="#ECEFEA">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Feuillet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=Caveat:wght@400;700&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,500&family=Nunito:wght@500;800&family=Amatic+SC:wght@700&family=Special+Elite&family=Pacifico&display=swap">
<style>
/* Layout: bibliothèque de carnets en grille, puis éditeur plein écran (barre de navigation, trousse d'outils, page sur un bureau). */
:root{
  --bg:#ECEFEA; --surface:#FBFBF8; --surface-2:#E2E7E0; --ink:#1E2622; --muted:#5D6A62;
  --line:#CBD3CA; --accent:#9B3B53; --accent-ink:#FFFFFF; --accent-soft:#F2DEE3; --sage:#6E8F78;
  --desk:#D9DED6; --shadow:rgba(30,38,34,.16); --danger:#B3261E;
  --f-display:"Gloock", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161917; --surface:#212622; --surface-2:#2B312D; --ink:#ECEFEA; --muted:#9BA69F;
  --line:#3A433C; --accent:#E38FA4; --accent-ink:#231419; --accent-soft:#3B2A30; --sage:#8FB39A;
  --desk:#101311; --shadow:rgba(0,0,0,.45); --danger:#F2867E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#161917; --surface:#212622; --surface-2:#2B312D; --ink:#ECEFEA; --muted:#9BA69F;
  --line:#3A433C; --accent:#E38FA4; --accent-ink:#231419; --accent-soft:#3B2A30; --sage:#8FB39A;
  --desk:#101311; --shadow:rgba(0,0,0,.45); --danger:#F2867E; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink)}
textarea,input[type=text]{-webkit-user-select:text;user-select:text}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Accueil ---------- */
#home{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.home-in{max-width:1180px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));padding-block:22px 60px;display:flex;flex-direction:column;gap:26px}
.home-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:clamp(34px,5vw,46px);letter-spacing:-.01em;line-height:1;margin:0;flex:1;min-width:0}
.brand small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.icon{padding:10px}
.btn:active{transform:scale(.97)}
.resume{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.resume canvas{width:74px;height:auto;border-radius:6px;box-shadow:0 2px 10px var(--shadow);background:#fff;flex:none}
.resume .rt{min-width:0;flex:1}
.resume .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.resume .ttl{font-family:var(--f-display);font-size:24px;margin:4px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .sub{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;padding:0 14px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.search:focus-within{border-color:var(--accent)}
#results{display:flex;flex-direction:column;gap:8px}
#results .hit{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
#results .hit canvas{width:52px;height:auto;border-radius:4px;box-shadow:0 1px 4px var(--shadow);flex:none;background:#fff}
#results .hit .ht{min-width:0;flex:1}
#results .hit b{display:block;font-size:15px}
#results .hit span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#results .hit mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:34px 26px}
.book{display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center;position:relative}
.book .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.book .t{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book .d{font-size:13px;color:var(--muted)}
.book .more{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);color:#1E2622;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:3}
.book .fav{position:absolute;top:10px;left:16px;color:#E9B949;z-index:3;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);font-weight:400;margin-bottom:6px}

/* Couverture façon carnet relié */
.cover{position:relative;aspect-ratio:3/4;border-radius:4px 12px 12px 4px;overflow:hidden;box-shadow:0 10px 22px -10px var(--shadow),0 2px 4px rgba(0,0,0,.12);background:#7E9C86;max-width:100%}
.cover .pat{position:absolute;inset:0}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,.06) 70%,rgba(255,255,255,.12));z-index:2}
.cover::after{content:"";position:absolute;top:0;bottom:0;right:11%;width:3.5%;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,.15));z-index:2}
.cover .plate{position:absolute;left:18%;right:20%;top:30%;padding:10px 8px;background:rgba(255,253,248,.93);border-radius:6px;color:#2a2622;font-family:var(--f-display);font-size:clamp(13px,1.6vw,18px);line-height:1.15;z-index:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

/* ---------- Éditeur ---------- */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--desk);z-index:5}
.ebar{display:flex;align-items:center;gap:6px;background:var(--surface);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:6px;padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px))}
.ebar .title{flex:1;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ebar .title b{font-family:var(--f-display);font-weight:400;font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ebar .title span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:480px){.ebar{gap:0}.ebar .ib{width:38px}#eRedo{display:none}.ebar .title b{font-size:16px}}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;position:relative}
.ib:active{background:var(--surface-2)}
.ib[disabled]{opacity:.3}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.tbar{display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:4px 8px;padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));overflow-x:auto;scrollbar-width:none}
.tbar::-webkit-scrollbar{display:none}
.tbar .grp{display:flex;align-items:center;gap:2px;flex:none}
.tbar .sep{width:1px;height:28px;background:var(--line);margin:0 6px;flex:none}
.tool{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;position:relative;flex:none;color:var(--muted)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tool .dot{position:absolute;bottom:5px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px}
.tool.toggle[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sw{width:30px;height:30px;border-radius:50%;flex:none;margin:0 3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw{outline:1px solid var(--line);outline-offset:1px}
.sw[aria-pressed="true"]{outline:0;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sz{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--surface-2)}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;min-height:0}
#sheet{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0;box-shadow:0 18px 40px -18px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.12);background:#fff}
#sheet canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#ovl{position:absolute;inset:0;pointer-events:none}
.lnk{position:absolute;border:2px dashed rgba(155,59,83,.0);border-radius:6px}
.tool-lasso .lnk{border-color:rgba(155,59,83,.45);background:rgba(155,59,83,.05)}
.lnk .go{position:absolute;right:-14px;top:-14px;width:34px;height:34px;border-radius:50%;background:#9B3B53;color:#fff;display:grid;place-items:center;pointer-events:auto;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lnk .go svg{width:18px;height:18px;stroke-width:2.2}
.ribbon{position:absolute;right:70px;top:-6px;width:34px;height:72px;background:#C9A04A;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.2)}
#ruler{position:absolute;left:0;top:0;width:900px;height:84px;margin:-42px 0 0 -450px;pointer-events:auto;touch-action:none;border-radius:8px;background:rgba(248,250,247,.78);box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 0 0 1px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ruler svg{position:absolute;inset:0;width:100%;height:100%}
#ruler .ang{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:600 22px var(--f-ui);color:#1E2622;background:rgba(255,255,255,.9);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
#ruler .rot{position:absolute;right:-26px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:#1E2622;color:#fff;display:grid;place-items:center}
#selbox{position:absolute;border:1.5px dashed var(--accent);border-radius:4px;pointer-events:none}
#selbox .h{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);pointer-events:auto;touch-action:none}
#selbox .h.sc{right:-16px;bottom:-16px}
#selbox .h.ro{left:50%;top:-52px;margin-left:-15px;display:grid;place-items:center;color:var(--accent)}
#selbox .h.ro svg{width:16px;height:16px;stroke-width:2.4}
#selbox .h.ro::after{content:"";position:absolute;left:50%;top:28px;height:22px;width:1.5px;background:var(--accent)}
#selbar{position:absolute;display:flex;gap:2px;background:var(--ink);color:var(--surface);border-radius:14px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;z-index:4}
#selbar button{padding:9px 11px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
#selbar button:active{background:rgba(255,255,255,.15)}
#selbar button.hot{background:var(--accent);color:var(--accent-ink)}
.pnav{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 6px 18px var(--shadow);align-items:center;z-index:3}
.pnav span{font-size:13px;font-weight:600;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.pnav .ib{width:38px;height:38px;border-radius:50%}

/* ---------- Mosaïque des pages ---------- */
#mosaic{position:fixed;inset:0;z-index:8;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.mo-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.mo-top .tt{flex:1;min-width:0}
.mo-top h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:0;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo-top .tt span{font-size:13px;color:var(--muted)}
.mo-in{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.mo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 28px}
.mo-grid .pcell .n{font-size:17px}
.mo-sec{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.mo-sec h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.mo-sec span{color:var(--muted);font-size:13px}
.newbook{aspect-ratio:3/4;border-radius:4px 12px 12px 4px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-weight:600;font-size:14px;text-align:center;padding:10px;width:100%}
@media (max-width:560px){.mo-top .btn .lb{display:none}.mo-top .btn{padding:11px}.mo-grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}}
/* ---------- Tuto guidé ---------- */
.tour{position:fixed;inset:0;z-index:120;touch-action:none}
.tour.trying{pointer-events:none}
.tour.trying .tour-hole{display:none}
.tour.trying .tour-card{pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:12px 14px 10px}
.tour-hole{position:absolute;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 9999px rgba(12,16,14,.74);transition:left .32s ease,top .32s ease,width .32s ease,height .32s ease,border-radius .32s ease;pointer-events:none}
.tour-card{position:absolute;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));margin:0 auto;max-width:440px;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px 18px 14px;box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;transition:top .32s ease}
.tour-card h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.15}
.tour-card p{margin:0;font-size:16px;line-height:1.45;color:var(--ink)}
.tour-card .tf{display:flex;align-items:center;gap:8px;margin-top:4px}
.tour-card .tf .ct{flex:1;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tour-hole,.tour-card{transition:none}}
/* ---------- Fenêtres ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,17,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.panel{background:var(--surface);color:var(--ink);border-radius:20px;width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.panel.wide{width:min(980px,100%);height:100%}
.panel header{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.panel header h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;flex:1;min-width:0}
.panel .body{padding:6px 18px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.panel footer{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.field input[type=text],.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{border-radius:12px;border:2px solid transparent;padding:3px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.opt canvas{border-radius:6px;box-shadow:0 1px 4px var(--shadow);display:block}
.covpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px}
.covpick .opt{padding:2px}
.covpick .cover .plate{font-size:9px;padding:4px;top:32%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);font-size:16px;text-align:left}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 18px}
.pcell{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.pcell canvas{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 10px var(--shadow);background:#fff;display:block}
.pcell.cur canvas{outline:3px solid var(--accent);outline-offset:3px}
.pcell .n{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.pcell .bm{position:absolute;top:-3px;right:12%;width:14px;height:26px;background:#C9A04A;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
.pop{box-sizing:border-box;position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:14px;width:min(360px,calc(100vw - 24px));display:flex;flex-direction:column;gap:14px;max-height:70vh;overflow-y:auto}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.pal button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pal .add{display:grid;place-items:center;border:1.5px dashed var(--muted);box-shadow:none;position:relative;overflow:hidden}
.pal .add input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.note{font-size:14px;color:var(--muted);line-height:1.45}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px}
.stk button{aspect-ratio:1;border-radius:12px;background:var(--bg);display:grid;place-items:center;padding:8px;position:relative}
.stk button img{max-width:100%;max-height:100%;pointer-events:none}
.stk .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:14px;line-height:1}
.fonts{display:flex;gap:8px;flex-wrap:wrap}
.fonts button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);font-size:20px}
.fonts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toggle-row{display:flex;align-items:center;gap:14px;padding:6px 0}
.toggle-row .tx{flex:1;min-width:0}
.toggle-row .tx b{display:block;font-size:16px}
.toggle-row .tx span{font-size:13px;color:var(--muted)}
.sw-t{width:52px;height:32px;border-radius:999px;background:var(--surface-2);position:relative;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw-t[aria-pressed="true"]{background:var(--sage)}
.sw-t[aria-pressed="true"]::after{transform:translateX(20px)}
/* Éditeur d'image */
.ied{display:flex;flex-direction:column;gap:14px;min-height:0}
.ied .cv{position:relative;background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0 0/20px 20px;border-radius:12px;display:grid;place-items:center;min-height:240px;max-height:52vh;overflow:hidden;touch-action:none}
.ied .cv canvas{max-width:100%;max-height:52vh;display:block}
.ied .crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);touch-action:none}
.ied .crop i{position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.sl{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.sl output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:90;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s}
.busy{position:fixed;inset:0;z-index:95;background:rgba(15,20,17,.45);display:grid;place-items:center;color:#fff;font-weight:600;font-size:16px;text-align:center;padding:20px}
@media (max-width:560px){
  .scrim{align-items:flex-end;padding:0}
  .panel{border-radius:20px 20px 0 0;max-height:94%}
  .panel.wide{height:94%}
  .shelf{grid-template-columns:repeat(2,1fr);gap:26px 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
'use strict';
/* =========================================================
   Feuillet — carnets manuscrits pour iPad
   1. Outils de base, stockage, état
   ========================================================= */
const PW = 1000, PH = 1414;           // largeur fixe d'une page (unités page), hauteur A4 par défaut
const GRID = 23.8;                    // 5 mm sur une page A4 de 1000 unités
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const H = pg => (pg && pg.h) || PH;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k.startsWith('aria-') && typeof v === 'boolean') { el.setAttribute(k, String(v)); continue; }
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}

/* ---------- Icônes ---------- */
const IC = {

  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  fill: '<path d="M5 11l7-7 7 7-7 7z"/><path d="M5 11h14"/><path d="M20 15s2 2.3 2 3.5a2 2 0 0 1-4 0c0-1.2 2-3.5 2-3.5z"/>',
  brush: '<path d="M3 18c3 0 4-2 6-2s3 2 6 2 4-2 6-2"/><circle cx="6" cy="9" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="18" cy="9" r="2"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  rotate: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',

  check: '<path d="M5 12l5 5 9-10"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  shape: '<circle cx="8" cy="8" r="4.5"/><rect x="11" y="11" width="9" height="9" rx="1"/>',
  template: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  wand: '<path d="M4 20L15 9"/><path d="M14 4v3M19 9h-3M17.5 5.5l-2 2M12 3l.5 1.5M20 12l-1.5-.5"/>',
  crop: '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/>',
  flip: '<path d="M12 3v18"/><path d="M8 7L3 12l5 5zM16 7l5 5-5 5z"/>',
  dots: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  share: '<path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ''}</svg>`;

/* ---------- Toast & attente ---------- */
let toastT = 0;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false; t.style.opacity = '1';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = '0'; setTimeout(() => (t.hidden = true), 220); }, ms);
}
function busy(msg) {
  const el = h('div', { class: 'busy' }, msg || 'Un instant…'); document.body.append(el);
  return { set: m => (el.textContent = m), done: () => el.remove() };
}

/* ---------- Stockage (IndexedDB, avec repli en mémoire) ---------- */
const DB = {
  db: null, ok: false, mem: { notebooks: new Map(), pages: new Map(), assets: new Map(), meta: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const rq = indexedDB.open('feuillet', 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          d.createObjectStore('notebooks', { keyPath: 'id' });
          const p = d.createObjectStore('pages', { keyPath: 'id' }); p.createIndex('nb', 'nb');
          d.createObjectStore('assets', { keyPath: 'id' });
          d.createObjectStore('meta', { keyPath: 'id' });
        };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      this.ok = true;
    } catch (e) { this.ok = false; console.warn('IndexedDB indisponible', e); }
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s); if (r) r.onsuccess = () => (out = r.result);
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async put(store, obj) { if (!this.ok) { this.mem[store].set(obj.id, obj); return; } return this._req(store, 'readwrite', s => s.put(obj)); },
  async get(store, id) { if (!this.ok) return this.mem[store].get(id); return this._req(store, 'readonly', s => s.get(id)); },
  async del(store, id) { if (!this.ok) { this.mem[store].delete(id); return; } return this._req(store, 'readwrite', s => s.delete(id)); },
  async all(store) { if (!this.ok) return [...this.mem[store].values()]; return this._req(store, 'readonly', s => s.getAll()); },
  async byNb(nb) {
    if (!this.ok) return [...this.mem.pages.values()].filter(p => p.nb === nb);
    return this._req('pages', 'readonly', s => s.index('nb').getAll(nb));
  },
};

/* ---------- Images enregistrées (assets) ---------- */
const imgCache = new Map(); // id -> {img, ready, w, h}
let onAssetReady = null;
async function putAsset(blob) { const id = 'a' + uid(); await DB.put('assets', { id, blob, t: Date.now() }); return id; }
function getImg(id) {
  let e = imgCache.get(id);
  if (e) return e;
  e = { img: new Image(), ready: false, p: null };
  imgCache.set(id, e);
  e.p = (async () => {
    try {
      const rec = await DB.get('assets', id);
      if (!rec) return;
      const url = URL.createObjectURL(rec.blob);
      await new Promise((res, rej) => { e.img.onload = res; e.img.onerror = rej; e.img.src = url; });
      e.ready = true; e.w = e.img.naturalWidth; e.h = e.img.naturalHeight;
      if (onAssetReady) onAssetReady(id);
    } catch (err) { console.warn('image', id, err); }
  })();
  return e;
}
async function loadImg(id) { const e = getImg(id); await e.p; return e.ready ? e.img : null; }
function canvasToBlob(c, type = 'image/png', q = 0.9) {
  return new Promise(res => c.toBlob(b => res(b), type, q));
}
function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 0); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible')); }; im.src = url;
  });
}
async function importImageFile(file, max = 1800) {
  const im = await fileToImage(file);
  let w = im.naturalWidth, hh = im.naturalHeight; const k = Math.min(1, max / Math.max(w, hh));
  w = Math.round(w * k); hh = Math.round(hh * k);
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  c.getContext('2d').drawImage(im, 0, 0, w, hh);
  const png = /png|webp|gif|svg/.test(file.type);
  const blob = await canvasToBlob(c, png ? 'image/png' : 'image/jpeg', 0.9);
  const id = await putAsset(blob);
  return { id, w, h: hh };
}

      } catch (e) { console.warn('save', e); dirty.add(o); failed = true; }

    }

  const s = land ? Math.min((r.width - 48) / PW, 1.1) : Math.min((r.width - 24) / PW, (r.height - 84) / hh);
  ED.fit = s; ED.s = s; ED.tx = (r.width - PW * s) / 2; ED.ty = land ? 12 : Math.max(12, (r.height - 70 - hh * s) / 2); applyView();
}

  const r = stage.getBoundingClientRect(), w = PW * ED.s, hh = H(curPage()) * ED.s, m = 80;
  if (w > r.width) ED.tx = clamp(ED.tx, r.width - w - m, m); else ED.tx = clamp(ED.tx, -w / 2, r.width - w / 2);
  if (hh > r.height) ED.ty = clamp(ED.ty, r.height - hh - m, m); else ED.ty = clamp(ED.ty, -hh / 2, r.height - hh / 2);

/* Découper une zone d'une photo (la fleur !) */
async function cutImage(item, poly, hole) {
  const im = await loadImg(item.a); if (!im) return toast('Photo introuvable');
  const nw = im.naturalWidth, nh = im.naturalHeight;
  const toPx = ([x, y]) => { const [lx, ly] = rotPt(x, y, item.x, item.y, -(item.r || 0)); return [(lx - item.x + item.w / 2) / item.w * nw, (ly - item.y + item.h / 2) / item.h * nh]; };
  const pp = poly.map(toPx);
  let x1 = Math.max(0, Math.floor(Math.min(...pp.map(p => p[0])))), y1 = Math.max(0, Math.floor(Math.min(...pp.map(p => p[1]))));
  let x2 = Math.min(nw, Math.ceil(Math.max(...pp.map(p => p[0])))), y2 = Math.min(nh, Math.ceil(Math.max(...pp.map(p => p[1]))));
  if (x2 - x1 < 4 || y2 - y1 < 4) return toast('Entoure une zone à l’intérieur de la photo');
  const path = new Path2D(); pp.forEach(([x, y], i) => i ? path.lineTo(x, y) : path.moveTo(x, y)); path.closePath();
  const c = document.createElement('canvas'); c.width = x2 - x1; c.height = y2 - y1;
  const g = c.getContext('2d'); g.translate(-x1, -y1); g.clip(path); g.drawImage(im, 0, 0);
  const pieceId = await putAsset(await canvasToBlob(c));
  const pcx = (x1 + x2) / 2 / nw * item.w - item.w / 2, pcy = (y1 + y2) / 2 / nh * item.h - item.h / 2;
  const [px, py] = rotPt(item.x + pcx, item.y + pcy, item.x, item.y, item.r || 0);
  const piece = { t: 'img', a: pieceId, x: px, y: py, w: (x2 - x1) / nw * item.w, h: (y2 - y1) / nh * item.h, r: item.r || 0, o: item.o };
  const pg = curPage(); let items;
  if (hole) {
    const c2 = document.createElement('canvas'); c2.width = nw; c2.height = nh; const g2 = c2.getContext('2d');
    g2.drawImage(im, 0, 0); g2.globalCompositeOperation = 'destination-out'; g2.fill(path);
    const holeId = await putAsset(await canvasToBlob(c2));
    const rep = { ...item, a: holeId }; await getImg(holeId).p;
    items = pg.items.map(i => i === item ? rep : i); items.splice(items.indexOf(rep) + 1, 0, piece);
  } else { items = pg.items.slice(); items.splice(items.indexOf(item) + 1, 0, piece); }
  await getImg(pieceId).p;
  commit(pg, items); if (S.tool !== 'lasso') { S.tool = 'lasso'; buildToolbar(); }
  selectItems([piece]); toast(hole ? 'Découpé ! Fais glisser le morceau où tu veux.' : 'Copié ! Fais glisser le morceau où tu veux.');
}

/* ---------- Clavier (ordinateur) ---------- */
function onKey(e) {
  if ($('#editor').hidden || openModals.length || /input|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel && S.sel.items.length) deleteSel();
  else if (e.key === 'Escape') clearSel();
  else if (e.key === 'ArrowRight' && !S.sel) showPage(S.idx + 1);
  else if (e.key === 'ArrowLeft' && !S.sel) showPage(S.idx - 1);
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const old = $(`script[src="${src}"]`);
    if (old && old.dataset.ok) return res();
    if (old) old.remove();
    const s = h('script', { src }); s.onload = () => { s.dataset.ok = '1'; res(); }; s.onerror = () => { s.remove(); rej(new Error('script')); }; document.head.append(s);
  });
}
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
/* Transformer des fichiers (PDF ou images) en pages prêtes à décorer */
async function filesToPages(files, nbId, bz) {
  const recs = []; let links = 0;
  for (const f of files) {
    // on regarde le contenu du fichier, pas seulement son nom (Android envoie parfois des photos sans extension)
    let sig = ''; try { sig = String.fromCharCode(...new Uint8Array(await f.slice(0, 5).arrayBuffer())); } catch (e) { }
    const isPdf = sig.startsWith('%PDF') || /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);
    if (isPdf) {
      await loadScript(PDFJS + 'pdf.min.js'); await loadScript(PDFJS + 'pdf.worker.min.js');
      const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
      const pdf = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false }).promise;
      const n = Math.min(pdf.numPages, 400), base = recs.length, pend = [];
      for (let i = 1; i <= n; i++) {
        bz.set(`Import de la page ${i} sur ${n}…`);
        const page = await pdf.getPage(i), vp1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: 1500 / vp1.width });
        const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: g, viewport: vp }).promise;
        const a = await putAsset(await canvasToBlob(c, 'image/jpeg', .86));
        recs.push({ id: 'p' + uid(), nb: nbId, h: PW * vp1.height / vp1.width, bg: 'img', paper: '#ffffff', bgA: a, items: [], bm: false });
        try {
          const k = PW / vp1.width;
          for (const an of await page.getAnnotations()) {
            if (an.subtype !== 'Link' || !an.dest) continue;
            let d = an.dest; if (typeof d === 'string') d = await pdf.getDestination(d);
            if (!Array.isArray(d)) continue;
            const to = typeof d[0] === 'number' ? d[0] : await pdf.getPageIndex(d[0]);
            const [x1, y1, x2, y2] = vp1.convertToViewportRectangle(an.rect);
            pend.push({ from: base + i - 1, to: base + to, x: Math.min(x1, x2) * k, y: Math.min(y1, y2) * k, w: Math.abs(x2 - x1) * k, h: Math.abs(y2 - y1) * k });
          }
        } catch (e) { }
      }
      for (const L of pend) if (recs[L.from] && recs[L.to] && L.to < base + n) { recs[L.from].items.push({ t: 'link', x: L.x, y: L.y, w: L.w, h: L.h, to: recs[L.to].id }); links++; }
    } else {
      bz.set('Import de l’image…');
      try {
        const r = await importImageFile(f, 2200);
        recs.push({ id: 'p' + uid(), nb: nbId, h: clamp(PW * r.h / r.w, 400, 3000), bg: 'img', paper: '#ffffff', bgA: r.id, items: [], bm: false });
      } catch (e) { console.warn('fichier ignoré', f.name, f.type); }
    }
  }
  return { recs, links };
}

/* Ménage : supprime les images que plus aucun carnet, page, modèle ou autocollant n'utilise */
async function cleanOrphanAssets() {
  if (!DB.ok) return 0;
  await flushSaves();
  const used = new Set(), addItems = its => (its || []).forEach(i => { if (i.t === 'img' && i.a) used.add(i.a); });
  for (const n of await DB.all('notebooks')) if (n.cover && n.cover.a) used.add(n.cover.a);
  for (const pg of await DB.all('pages')) { addItems(pg.items); if (pg.bgA) used.add(pg.bgA); if (pg.trace && pg.trace.a) used.add(pg.trace.a); }
  for (const pg of S.pages.values()) [pg.items, ...(pg.undo || []), ...(pg.redo || [])].forEach(addItems); // l'historique d'annulation du carnet ouvert
  (P.stickers || []).forEach(a => used.add(a));
  (P.templates || []).forEach(t => { addItems(t.items); if (t.bgA) used.add(t.bgA); });
  (P.compos || []).forEach(c => addItems(c.items));
  (S.clip || []).forEach(i => i.t === 'img' && used.add(i.a));
  let n = 0;
  for (const a of await DB.all('assets')) if (!used.has(a.id) && Date.now() - (a.t || 0) > 60000) { await DB.del('assets', a.id); imgCache.delete(a.id); n++; }
  return n;
}

/* =========================================================
   7. Carnet de démonstration : chaque outil utilisé pour de vrai
   ========================================================= */
const DT = (txt, x, y, s, c = '#1d2730', f = 'Caveat', al = 'left', extra = {}) => ({ t: 'txt', txt, x, y, s, c, f, al, r: 0, ...extra });
const TITLE = (txt, y = 120, c = '#8a2442') => DT(txt, 500, y, 74, c, 'Dancing Script', 'center');
const wrapTxt = (txt, n) => { const out = []; let line = ''; for (const w of txt.split(' ')) { if ((line + ' ' + w).trim().length > n) { out.push(line.trim()); line = w; } else line += ' ' + w; } out.push(line.trim()); return out.join('\n'); };
const NOTE = (txt, x, y, s = 30) => { const n = Math.floor((PW - x - 70) / (s * .44)), t = wrapTxt(txt, n), k = t.split('\n').length; return DT(t, x, y + (k - 1) * s * .62, s, '#5d6a62', 'Caveat', 'left'); };
function flatPts(pts, pr) { const o = []; pts.forEach(([x, y], i) => o.push(x, y, typeof pr === 'function' ? pr(i, pts.length) : pr)); return o; }
// boucles d'écriture liée (cycloïde) : la pression varie comme sous un vrai stylet
function loopsPts(x0, y0, len, r = 22) {
  const pts = [], k = 9, n = Math.floor(len / k * 6);
  for (let i = 0; i <= n; i++) { const t = i / 6; pts.push([x0 + k * t - r * .9 * Math.sin(t), y0 - r * Math.cos(t) * .9]); }
  return pts;
}
const wavePts = (x0, y0, len, amp = 18, per = 90) => Array.from({ length: Math.ceil(len / 3) + 1 }, (_, i) => [x0 + i * 3, y0 + Math.sin(i * 3 / per * Math.PI * 2) * amp]);
const ellipsePts = (cx, cy, rx, ry) => Array.from({ length: 97 }, (_, i) => { const a = i / 96 * Math.PI * 2 - Math.PI / 2; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const arcPts = (cx, cy, rx, ry, a0, a1, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const heartPts = (cx, cy, s) => Array.from({ length: 121 }, (_, i) => { const t = i / 120 * Math.PI * 2; return [cx + s * 16 * Math.pow(Math.sin(t), 3) / 16, cy - s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16]; });
const S_ = (k, c, w, pts, pr = .55) => ({ t: 's', k, c, w, p: flatPts(pts, pr) });

  g.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 9; i++) g.fillRect(w * (.1 + i * .09), hh * (.7 + (i % 3) * .07), w * .05, 2);
  g.fillStyle = '#4f6b50'; for (let i = 0; i < 7; i++) { const x = w * (.03 + i * .05), y = hh * .66; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 16, y - 70 - (i % 3) * 18); g.lineTo(x + 32, y); g.fill(); }
};
const drawColoring = (g, w, hh) => { // coloriage : contours noirs sur fond blanc, comme ceux qu'on génère avec une IA

  const cx = w / 2, cy = hh * .42;

  g.beginPath(); g.ellipse(cx - 60, hh * .8, 55, 24, -.6, 0, 7); g.stroke(); g.beginPath(); g.ellipse(cx + 58, hh * .74, 55, 24, .6, 0, 7); g.stroke();
};
const HOUSE = [[[300, 700], [300, 1000], [700, 1000], [700, 700]], [[260, 720], [500, 520], [740, 720]], [[450, 1000], [450, 860], [550, 860], [550, 1000]], [[360, 760], [430, 760], [430, 820], [360, 820], [360, 760]]];

let tourEl = null;
function tourRect(st) {
  if (!st.el) return null;
  let t = typeof st.el === 'function' ? st.el() : $(st.el);
  if (!t) return null;
  if (t.nodeType === 1) {
    if (t.closest('[hidden]') || !t.getClientRects().length) return null;
    t.scrollIntoView({ block: 'nearest', inline: 'center' });
    t = t.getBoundingClientRect();
  }
  return t.width > 0 && t.height > 0 ? t : null;
}
// steps : { el, title, text, shape, before, try: 'consigne pendant l’essai' }

function runTour(steps, onEnd, start = 0) {

  let i = clamp(start, 0, steps.length - 1), trying = false, triedTool = false;
  const prevTool = S.tool;
  const hole = h('div', { class: 'tour-hole' }), card = h('div', { class: 'tour-card', role: 'dialog', 'aria-live': 'polite' });
  const el = h('div', { class: 'tour' }, hole, card); document.body.append(el); tourEl = el;
  el.addEventListener('pointerdown', e => { if (!trying && !card.contains(e.target)) { e.preventDefault(); e.stopPropagation(); } });
  let rz = 0; const onResize = () => { clearTimeout(rz); rz = setTimeout(place, 120); };
  window.addEventListener('resize', onResize); window.addEventListener('orientationchange', onResize);
  const end = finished => {
    window.removeEventListener('resize', onResize); window.removeEventListener('orientationchange', onResize);
    el.remove(); if (tourEl === el) tourEl = null; const tb = $('#tbar'); if (tb) tb.scrollLeft = 0;
    // l'outil choisi pour l'explication est remis comme avant, sauf si elle vient de l'essayer
    if (!triedTool && S.tool !== prevTool && !$('#editor').hidden) setTool(prevTool);
    onEnd && onEnd(finished, i);
  };
  const btn = (label, cls, fn) => h('button', { class: 'btn ' + cls, style: { padding: '8px 14px' }, onclick: fn }, label);
  const show = () => {
    const st = steps[i]; trying = false; el.classList.remove('trying'); if (st.before) st.before();
    card.innerHTML = '';
    const last = i === steps.length - 1, next = () => { if (last) end(true); else { i++; show(); } };
    card.append(h('h3', null, st.title || ''), ...(st.text ? [].concat(st.text).map(t => h('p', null, t)) : []),
      h('div', { class: 'tf' }, h('span', { class: 'ct' }, `${i + 1} / ${steps.length}`),
        !last && btn('Passer', 'ghost', () => end(false)),
        i > 0 && btn('Précédent', '', () => { i--; show(); }),
        st.try && btn('Essayer', '', () => tryIt(st)),
        btn(last ? (st.done || 'Terminer') : 'Suivant', 'primary', next)));

    const last = i === steps.length - 1;
    card.append(h('p', null, h('b', null, 'À toi : '), st.try),
      h('div', { class: 'tf' }, h('span', { class: 'ct' }, `${i + 1} / ${steps.length}`),
        btn('Revoir l’explication', 'ghost', show),
        btn(last ? 'J’ai essayé, terminer' : 'J’ai essayé, suite', 'primary', () => { if (last) end(true); else { i++; show(); } })));
    requestAnimationFrame(place);
  };
  const place = () => {
    const st = steps[i], vh = window.innerHeight, ch = card.offsetHeight;
    if (trying) { Object.assign(hole.style, { width: '0px', height: '0px' }); card.style.top = Math.max(12, vh - ch - 16 - (parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0)) + 'px'; return; }
    if (st.el && st.el.zone && !$('#editor').hidden) bringIntoView(st.el.zone);
    const r = tourRect(st);
    if (r) {
      const pad = st.pad == null ? 10 : st.pad; let w = r.width + pad * 2, hh = r.height + pad * 2;
      if (st.shape !== 'rect') { w = hh = Math.max(w, hh); }
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      Object.assign(hole.style, { left: cx - w / 2 + 'px', top: cy - hh / 2 + 'px', width: w + 'px', height: hh + 'px', borderRadius: st.shape === 'rect' ? '18px' : '50%' });
      const below = cy + hh / 2 + 18, above = cy - hh / 2 - 18 - ch;
      card.style.top = (below + ch < vh - 12 ? below : above > 12 ? above : Math.max(12, vh - ch - 20)) + 'px';
    } else {
      Object.assign(hole.style, { left: '50%', top: '50%', width: '0px', height: '0px' });
      card.style.top = Math.max(16, (vh - ch) / 2) + 'px';
    }
  };

}

function helpMenu() {
  const pg = curPage();
  const list = h('div', { class: 'menu' });
  if (pg && pg.tour && PAGE_TOURS[pg.tour]) list.append(h('button', { onclick: () => { m.close(); runPageTour(pg.tour, true); } }, h('span', { html: icon('star') }), 'Revoir le guide de cette page'));
  HELP_TOPICS.forEach(([n, make]) => list.append(h('button', { onclick: () => { m.close(); if (S.sel) clearSel(); runTour(make()); } }, h('span', { html: icon('arrow') }), n)));
  list.append(h('button', { onclick: async () => { m.close(); await loadNotebooks(); const t = S.notebooks.find(n => n.tuto && !n.parent); if (t) openNotebook(t.id, null, true); else toast('Le carnet tuto a été supprimé : Réglages → « Remettre le carnet tuto ».', 4200); } }, h('span', { html: icon('file') }), 'Ouvrir le carnet tuto complet'));
  const m = modal({ title: 'Aide', body: list });
}
